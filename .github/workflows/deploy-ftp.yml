name: Build, Test, Migrate & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migrate:
    uses: ./.github/workflows/db-migrate.yml
    secrets: inherit

  build-test-deploy:
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking while technical debt is paid down — see docs/PRIORITIES.md)
        run: npm run lint
        continue-on-error: true

      - name: Architecture boundary check
        run: npm run check:architecture

      - name: Build app for /qms/
        env:
          VITE_BASE_PATH: /qms/
        run: npm run build

      - name: Verify build output contains index.html
        run: |
          ls -lah dist
          test -f dist/index.html

      - name: Deploy dist/ to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
